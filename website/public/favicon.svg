<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="tq-bridge">
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#166f5c"/>
      <stop offset="1" stop-color="#0c4a3d"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- geometric t (stem stops above the bridge) -->
  <path
    fill="#f2fbf8"
    d="M8.8 8.4h14.4a1.1 1.1 0 0 1 0 2.2h-5.35v8.1a1.15 1.15 0 0 1-2.3 0v-8.1H8.8a1.1 1.1 0 1 1 0-2.2z"
  />

  <!-- bridge: two piers + arch = remote to local -->
  <path
    fill="none"
    stroke="#8fdcc9"
    stroke-width="1.85"
    stroke-linecap="round"
    d="M9.6 25.1c1.85-2.55 4.05-3.85 6.4-3.85s4.55 1.3 6.4 3.85"
  />
  <circle cx="9.6" cy="25.1" r="1.15" fill="#8fdcc9"/>
  <circle cx="22.4" cy="25.1" r="1.15" fill="#8fdcc9"/>
</svg>
